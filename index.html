<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Expense Tracker</h1>
    <p>Manage your money smarter!</p>
</header>

<main>
    <div class="dashboard-cards">

    <section class="summary">
        <h2>Total Expenses</h2>
        <p id="total-expenses">₹0.00</p>
    </section>

    <section class="budget-card">
        <h2>Monthly Budget</h2>
        <p id="monthly-budget">₹5,000.00</p>

        <label for="budget-input">Set your budget (₹)</label>
        <input type="number" id="budget-input"
               min="1" placeholder="Enter monthly budget">

        <button id="save-budget">Save Budget</button>
    </section>

    <section class="remaining-card">
        <h2>Budget Remaining</h2>
        <p id="remaining-budget">₹5,000.00</p>
    </section>

</div>

    <section class="add-expense">
        <h2>Add New Expense</h2>

        <form id="expense-form">
            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name"
                   placeholder="e.g. Lunch" required>

            <label for="expense-amount">Amount (₹)</label>
            <input type="number" id="expense-amount"
                   placeholder="e.g. 150" min="0.01"
                   step="0.01" required>

            <label for="expense-category">Category</label>
            <select id="expense-category" required>
                <option value="">Select a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
            <label for="expense-date">Date</label>
<input type="date" id="expense-date" required>

            <button type="submit">Add Expense</button>
        </form>
    </section>

    <section class="expense-list">
        <h2>Your Expenses</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expense-table">
                <!-- Expenses will appear here -->
            </tbody>
        </table>
    </section>
    <section class="chart-section">
    <h2>Expense Breakdown</h2>
    <p>See where your money goes.</p>

    <div class="month-filter">
        <label for="month-filter">Filter by month:</label>
        <input type="month" id="month-filter">
        <button type="button" id="clear-filter">Show All</button>
    </div>

    <div class="chart-container">
        <canvas id="expense-chart"></canvas>
    </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>


</body>
</html>
